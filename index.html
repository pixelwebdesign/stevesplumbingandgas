<script>
    document.addEventListener(&quot;DOMContentLoaded&quot;, function() {
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.15
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    // Keep observing if we want it to repeat, otherwise unobserve
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.scroll-animate').forEach((el) => {
            observer.observe(el);
            // Optionally, trigger it immediately if already in view before JS runs
            if (el.getBoundingClientRect().top < window.innerHeight) {
                el.classList.add('is-visible');
            }
        });

        // &quot;What We Do&quot; cards: on mobile they scroll horizontally, so keep the little
        // dot indicator in sync with whichever card is currently in view. (On desktop
        // this container is a regular grid and never scrolls, so the dots stay hidden
        // and this listener is a no-op.)
        (function () {
            const scroller = document.getElementById('services-scroll');
            const dots = Array.from(document.querySelectorAll('#services-dots .service-dot'));
            if (!scroller || !dots.length) return;
            const cards = Array.from(scroller.children);

            function updateDots() {
                const scrollerRect = scroller.getBoundingClientRect();
                const center = scrollerRect.left + scrollerRect.width / 2;
                let closest = 0;
                let closestDist = Infinity;
                cards.forEach((card, i) => {
                    const rect = card.getBoundingClientRect();
                    const cardCenter = rect.left + rect.width / 2;
                    const dist = Math.abs(cardCenter - center);
                    if (dist < closestDist) {
                        closestDist = dist;
                        closest = i;
                    }
                });
                dots.forEach((dot, i) => dot.classList.toggle('active', i === closest));
            }

            let ticking = false;
            scroller.addEventListener('scroll', function () {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(function () {
                    updateDots();
                    ticking = false;
                });
            }, { passive: true });

            dots.forEach((dot, i) => {
                dot.style.cursor = 'pointer';
                dot.addEventListener('click', function () {
                    const card = cards[i];
                    if (card) card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                });
            });

            updateDots();
        })();

        // Reviews: rotate the spotlighted testimonial every few seconds. On desktop the
        // CSS above shows all three at once, so this keeps running harmlessly in the
        // background without any visible effect there.
        (function () {
            const stage = document.getElementById('reviews-stage');
            const slides = stage ? Array.from(stage.querySelectorAll('.review-slide')) : [];
            const dots = Array.from(document.querySelectorAll('#reviews-dots .review-dot'));
            if (!stage || slides.length < 2) return;

            const intervalMs = 4500;
            let index = slides.findIndex((s) => s.classList.contains('active'));
            if (index < 0) index = 0;
            let timer = null;
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            function show(i) {
                index = (i + slides.length) % slides.length;
                slides.forEach((s, si) => s.classList.toggle('active', si === index));
                dots.forEach((d, di) => d.classList.toggle('active', di === index));
            }

            function start() {
                stop();
                if (reduceMotion) return;
                timer = setInterval(() => show(index + 1), intervalMs);
            }

            function stop() {
                if (timer) clearInterval(timer);
                timer = null;
            }

            dots.forEach((dot) => {
                dot.addEventListener('click', function () {
                    show(parseInt(dot.dataset.index, 10));
                    start();
                });
            });

            stage.addEventListener('mouseenter', stop);
            stage.addEventListener('mouseleave', start);

            show(index);
            start();
        })();

        // Mobile hamburger menu: opens the same links the desktop nav has.
        (function () {
            const toggle = document.getElementById('mobile-menu-toggle');
            const menu = document.getElementById('mobile-menu');
            const icon = document.getElementById('mobile-menu-icon');
            if (!toggle || !menu) return;

            function closeMenu() {
                menu.classList.add('hidden');
                toggle.setAttribute('aria-expanded', 'false');
                if (icon) icon.textContent = 'menu';
            }
            function openMenu() {
                menu.classList.remove('hidden');
                toggle.setAttribute('aria-expanded', 'true');
                if (icon) icon.textContent = 'close';
            }

            toggle.addEventListener('click', function (e) {
                e.stopPropagation();
                if (menu.classList.contains('hidden')) openMenu(); else closeMenu();
            });

            menu.querySelectorAll('a').forEach(function (a) {
                a.addEventListener('click', closeMenu);
            });

            document.addEventListener('click', function (e) {
                if (!menu.classList.contains('hidden') &amp;&amp; !menu.contains(e.target) &amp;&amp; e.target !== toggle &amp;&amp; !toggle.contains(e.target)) {
                    closeMenu();
                }
            });

            window.addEventListener('resize', function () {
                if (window.innerWidth >= 768) closeMenu();
            });
        })();

        // Phone / email buttons: on a real phone, &quot;tel:&quot; links should just open the
        // dialer as normal. On a computer there's nothing to dial, so we copy the
        // number instead -- and email addresses are always copied, on any device.
        (function () {
            function isMobileDevice() {
                var ua = navigator.userAgent || '';
                if (/Android|iPhone|iPad|iPod|Windows Phone|Mobile/i.test(ua)) return true;
                if (window.matchMedia &amp;&amp; window.matchMedia('(pointer: coarse)').matches) return true;
                return false;
            }

            function copyText(text) {
                function fallback() {
                    return new Promise(function (resolve, reject) {
                        try {
                            var ta = document.createElement('textarea');
                            ta.value = text;
                            ta.setAttribute('readonly', '');
                            ta.style.position = 'fixed';
                            ta.style.top = '-1000px';
                            ta.style.opacity = '0';
                            document.body.appendChild(ta);
                            ta.focus();
                            ta.select();
                            var ok = document.execCommand('copy');
                            document.body.removeChild(ta);
                            if (ok) resolve(); else reject(new Error('execCommand failed'));
                        } catch (err) {
                            reject(err);
                        }
                    });
                }
                if (navigator.clipboard &amp;&amp; navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(text).catch(fallback);
                }
                return fallback();
            }

            var toast = document.getElementById('copy-toast');
            function showToast(msg) {
                if (!toast) return;
                toast.textContent = msg;
                toast.classList.remove('opacity-0');
                toast.classList.add('opacity-100');
                clearTimeout(toast._hideTimer);
                toast._hideTimer = setTimeout(function () {
                    toast.classList.remove('opacity-100');
                    toast.classList.add('opacity-0');
                }, 1800);
            }

            document.querySelectorAll('a[href^=&quot;tel:&quot;]').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    if (isMobileDevice()) return; // let the phone open its dialer normally
                    e.preventDefault();
                    var number = a.getAttribute('href').replace('tel:', '');
                    copyText(number).then(function () {
                        showToast('Número copiado: ' + number);
                    });
                });
            });

            document.querySelectorAll('a[href^=&quot;mailto:&quot;]').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    var email = a.getAttribute('href').replace('mailto:', '').split('?')[0];
                    copyText(email).then(function () {
                        showToast('Email copiado: ' + email);
                    });
                });
            });
        })();
    });
</script>

<script>
        // Suburb and Service Logic
        (function() {
            const suburbSelect = document.getElementById('suburb');
            const serviceSelect = document.getElementById('serviceType');
            
            const allServices = [
                { value: 'plumbing', text: 'Plumbing' },
                { value: 'gas_fitting', text: 'Gas Fitting' },
                { value: 'drainage', text: 'Drainage' }
            ];

            suburbSelect.addEventListener('change', function() {
                const selectedSuburb = this.value;
                
                if (!selectedSuburb) {
                    serviceSelect.disabled = true;
                    serviceSelect.innerHTML = '<option disabled selected value=&quot;&quot;>Select Suburb First</option>';
                    return;
                }

                serviceSelect.disabled = false;
                serviceSelect.innerHTML = '<option disabled selected value=&quot;&quot;>Select Service</option>';
                
                if (selectedSuburb === 'other') {
                    allServices.forEach(service => {
                        if (service.value === 'plumbing' || service.value === 'gas_fitting') {
                            const opt = document.createElement('option');
                            opt.value = service.value;
                            opt.textContent = service.text;
                            serviceSelect.appendChild(opt);
                        }
                    });
                } else {
                    allServices.forEach(service => {
                        const opt = document.createElement('option');
                        opt.value = service.value;
                        opt.textContent = service.text;
                        serviceSelect.appendChild(opt);
                    });
                }
            });
        })();

        // File upload logic
        (function() {
            const fileInput = document.getElementById('photoUpload');
            const dropZone = document.getElementById('dropZone');
            const uploadStatus = document.getElementById('uploadStatus');

            if(dropZone &amp;&amp; fileInput) {
                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    dropZone.addEventListener(eventName, e => {
                        e.preventDefault();
                        e.stopPropagation();
                    }, false);
                });

                ['dragenter', 'dragover'].forEach(eventName => {
                    dropZone.addEventListener(eventName, () => {
                        dropZone.classList.add('bg-surface-container-low', 'border-secondary-container');
                    }, false);
                });

                ['dragleave', 'drop'].forEach(eventName => {
                    dropZone.addEventListener(eventName, () => {
                        dropZone.classList.remove('bg-surface-container-low', 'border-secondary-container');
                    }, false);
                });

                dropZone.addEventListener('drop', e => {
                    const files = e.dataTransfer.files;
                    handleFiles(files);
                }, false);

                dropZone.addEventListener('click', () => fileInput.click());

                fileInput.addEventListener('change', function() {
                    handleFiles(this.files);
                });

                function handleFiles(files) {
                    if(files.length > 0) {
                        uploadStatus.textContent = ` - ${files.length} file(s) selected`;
                    }
                }
            }
        })();

        // Reveal Animation Logic
        document.addEventListener('DOMContentLoaded', () => {
            const reveals = document.querySelectorAll('.reveal');
            const formSections = document.querySelectorAll('.form-section-animate');
            
            const revealOptions = {
                threshold: 0.1,
                rootMargin: &quot;0px 0px -50px 0px&quot;
            };

            const revealObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    
                    entry.target.classList.add('active');
                    observer.unobserve(entry.target);
                });
            }, revealOptions);

            reveals.forEach(reveal => {
                revealObserver.observe(reveal);
            });
            
            formSections.forEach(section => {
                revealObserver.observe(section);
            });

            // Mobile hamburger menu: opens the same links the desktop nav has.
            (function () {
                const toggle = document.getElementById('mobile-menu-toggle');
                const menu = document.getElementById('mobile-menu');
                const icon = document.getElementById('mobile-menu-icon');
                if (!toggle || !menu) return;

                function closeMenu() {
                    menu.classList.add('hidden');
                    toggle.setAttribute('aria-expanded', 'false');
                    if (icon) icon.textContent = 'menu';
                }
                function openMenu() {
                    menu.classList.remove('hidden');
                    toggle.setAttribute('aria-expanded', 'true');
                    if (icon) icon.textContent = 'close';
                }

                toggle.addEventListener('click', function (e) {
                    e.stopPropagation();
                    if (menu.classList.contains('hidden')) openMenu(); else closeMenu();
                });

                menu.querySelectorAll('a').forEach(function (a) {
                    a.addEventListener('click', closeMenu);
                });

                document.addEventListener('click', function (e) {
                    if (!menu.classList.contains('hidden') &amp;&amp; !menu.contains(e.target) &amp;&amp; e.target !== toggle &amp;&amp; !toggle.contains(e.target)) {
                        closeMenu();
                    }
                });

                window.addEventListener('resize', function () {
                    if (window.innerWidth >= 768) closeMenu();
                });
            })();

            // Phone / email buttons: on a real phone, &quot;tel:&quot; links should just open the
            // dialer as normal. On a computer there's nothing to dial, so we copy the
            // number instead -- and email addresses are always copied, on any device.
            (function () {
                function isMobileDevice() {
                    var ua = navigator.userAgent || '';
                    if (/Android|iPhone|iPad|iPod|Windows Phone|Mobile/i.test(ua)) return true;
                    if (window.matchMedia &amp;&amp; window.matchMedia('(pointer: coarse)').matches) return true;
                    return false;
                }

                function copyText(text) {
                    function fallback() {
                        return new Promise(function (resolve, reject) {
                            try {
                                var ta = document.createElement('textarea');
                                ta.value = text;
                                ta.setAttribute('readonly', '');
                                ta.style.position = 'fixed';
                                ta.style.top = '-1000px';
                                ta.style.opacity = '0';
                                document.body.appendChild(ta);
                                ta.focus();
                                ta.select();
                                var ok = document.execCommand('copy');
                                document.body.removeChild(ta);
                                if (ok) resolve(); else reject(new Error('execCommand failed'));
                            } catch (err) {
                                reject(err);
                            }
                        });
                    }
                    if (navigator.clipboard &amp;&amp; navigator.clipboard.writeText) {
                        return navigator.clipboard.writeText(text).catch(fallback);
                    }
                    return fallback();
                }

                var toast = document.getElementById('copy-toast');
                function showToast(msg) {
                    if (!toast) return;
                    toast.textContent = msg;
                    toast.classList.remove('opacity-0');
                    toast.classList.add('opacity-100');
                    clearTimeout(toast._hideTimer);
                    toast._hideTimer = setTimeout(function () {
                        toast.classList.remove('opacity-100');
                        toast.classList.add('opacity-0');
                    }, 1800);
                }

                document.querySelectorAll('a[href^=&quot;tel:&quot;]').forEach(function (a) {
                    a.addEventListener('click', function (e) {
                        if (isMobileDevice()) return; // let the phone open its dialer normally
                        e.preventDefault();
                        var number = a.getAttribute('href').replace('tel:', '');
                        copyText(number).then(function () {
                            showToast('Número copiado: ' + number);
                        });
                    });
                });

                document.querySelectorAll('a[href^=&quot;mailto:&quot;]').forEach(function (a) {
                    a.addEventListener('click', function (e) {
                        e.preventDefault();
                        var email = a.getAttribute('href').replace('mailto:', '').split('?')[0];
                        copyText(email).then(function () {
                            showToast('Email copiado: ' + email);
                        });
                    });
                });
            })();
        });
    </script>

<script>
(function(){
  document.addEventListener('click', function(e){
    var a = e.target.closest('a');
    if(!a) return;
    var href = a.getAttribute('href');
    if(!href) return;
    if(href === 'book-a-job.html' || href.indexOf('book-a-job.html#') === 0){
      e.preventDefault();
      var hash = href.split('#')[1] || null;
      parent.postMessage({type:'nav', file:'book-a-job.html', hash: hash}, '*');
    } else if(href === 'index.html' || href.indexOf('index.html#') === 0){
      e.preventDefault();
      var hash = href.split('#')[1] || null;
      parent.postMessage({type:'nav', file:'index.html', hash: hash}, '*');
    } else if(href.indexOf('#') === 0){
      // Pure same-page fragment link (e.g. &quot;#services&quot;). Handle it locally instead of
      // letting the browser resolve it, because a srcdoc iframe's default base URL is
      // the PARENT document's URL, not this document -- following it natively would
      // navigate this iframe away from its srcdoc content.
      e.preventDefault();
      if(href.length > 1){
        var target = document.getElementById(href.slice(1));
        if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
      }
    }
  });
  window.addEventListener('message', function(e){
    if(!e.data || e.data.type !== 'scrollTo') return;
    var behavior = e.data.instant ? 'instant' : 'smooth';
    if(e.data.hash){
      var el = document.getElementById(e.data.hash);
      if(el) el.scrollIntoView({behavior: behavior, block:'start'});
    } else {
      window.scrollTo({top:0, behavior: behavior});
    }
  });
})();
</script>

<script>
(function(){
  var frames = { 'index.html': document.getElementById('frame-home'), 'book-a-job.html': document.getElementById('frame-book') };
  var current = 'index.html';
  window.addEventListener('message', function(e){
    var data = e.data;
    if(!data || data.type !== 'nav') return;
    var target = frames[data.file];
    if(!target) return;

    if(data.file === current){
      // Already on this page: just relay the scroll request.
      target.contentWindow.postMessage({type:'scrollTo', hash: data.hash}, '*');
      return;
    }
    current = data.file;

    // Send the scroll target into the incoming page before it fades in,
    // so it is already in place the moment it becomes visible.
    target.contentWindow.postMessage({type:'scrollTo', hash: data.hash, instant:true}, '*');

    Object.keys(frames).forEach(function(k){ frames[k].classList.remove('active'); });
    requestAnimationFrame(function(){
      target.classList.add('active');
    });
  });
})();
</script>
